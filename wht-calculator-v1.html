            letter-spacing: 1px;

            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg-dark);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;

            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.2s;
        }

            padding: 5px;
            margin-bottom: 25px;

            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dim);
            transition: all 0.3s;

        .status-btn.active {
            background: var(--primary);
            color: #000;
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3);
        }

        /* Step 3: Input */
        .input-group { margin-bottom: 25px; }

        }

            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);

            font-weight: 600;

        .calc-btn {

            border: none;
            border-radius: 12px;

            font-size: 15px;

            text-transform: uppercase;
            letter-spacing: 1px;

        .calc-btn:hover {

</head>

    let selectedItem = null;
    let currentStatus = 'atl'; // atl, non, late

    const searchInput = document.getElementById('searchInput');
    const dropdownMenu = document.getElementById('dropdownMenu');

    // Populate Dropdown
    function renderDropdown(filter = "") {
        dropdownMenu.innerHTML = '';
        const filtered = taxData.filter(item => 
            item.sec.includes(filter) || 
            item.desc.toLowerCase().includes(filter.toLowerCase())
        );

        if(filtered.length === 0) {
            dropdownMenu.innerHTML = '<div class="dropdown-item" style="pointer-events:none; color:#555;">No results found</div>';
            return;
        }

        filtered.forEach(item => {
            const div = document.createElement('div');
            div.className = 'dropdown-item';
            div.innerHTML = `
                <span class="sec-code">Section ${item.sec}</span>
                <span class="sec-desc">${item.desc}</span>
            `;
            div.onclick = () => selectItem(item);
            dropdownMenu.appendChild(div);
        });
    }

    // Select Item
    function selectItem(item) {
        selectedItem = item;
        searchInput.value = `${item.desc} (Sec ${item.sec})`;
        dropdownMenu.classList.remove('active');
        document.getElementById('resultPanel').style.display = 'none';
    }

    // Set Status
    function setStatus(status) {
        currentStatus = status;
        document.querySelectorAll('.status-btn').forEach(btn => {
            btn.classList.remove('active');
            if(btn.dataset.status === status) btn.classList.add('active');
        });
        calculateTax(); // Recalculate if amount exists
    }

    // Calculate Logic
    function calculateTax() {
        if(!selectedItem) return;

        const amountVal = parseFloat(document.getElementById('amountInput').value);
        if(isNaN(amountVal) || amountVal <= 0) return;

        let rate = selectedItem[currentStatus]; // Get rate based on status
        let tax = 0;
        let rateDisplay = "";

        // Handle percentages
        if(selectedItem.type === 'percent') {
            tax = amountVal * (rate / 100);
            rateDisplay = `Rate Applied: ${rate}%`;
        } 
        // Handle Salary Slabs (Simplified estimation)
        else if(selectedItem.type.startsWith('salary_')) {
            // This is a simplified estimation for the tool.
            // In reality, tax is calculated progressively.
            // We show the marginal rate here for clarity.
            const marginalRate = parseFloat(selectedItem.type.split('_')[1]);
            tax = amountVal * (marginalRate / 100); 
            rateDisplay = `Est. Tax (Marginal Rate): ${marginalRate}%`;
        }
        // Handle Rent Slabs
        else if(selectedItem.type === 'rent_slab1') { // 300k-600k
            tax = (amountVal - 300000) * 0.05;
            rateDisplay = `5% on amount exceeding Rs. 300,000`;
        }
        else if(selectedItem.type === 'rent_slab2') { // 600k-2M
            tax = 15000 + ((amountVal - 600000) * 0.10);
            rateDisplay = `Rs. 15,000 + 10% on exceeding amount`;
        }
        else if(selectedItem.type === 'rent_slab3') { // >2M
            tax = 155000 + ((amountVal - 2000000) * 0.25);
            rateDisplay = `Rs. 155,000 + 25% on exceeding amount`;
        }

        // Format Currency
        const formatter = new Intl.NumberFormat('en-PK', { style: 'decimal', minimumFractionDigits: 0 });
        document.getElementById('taxAmount').innerText = `Rs. ${formatter.format(Math.round(tax))}`;
        document.getElementById('rateInfo').innerText = rateDisplay;
        document.getElementById('resultPanel').style.display = 'block';
    }

    // Event Listeners
    searchInput.addEventListener('focus', () => {
        dropdownMenu.classList.add('active');
        renderDropdown(searchInput.value);
    });

        renderDropdown(searchInput.value);
    });

            dropdownMenu.classList.remove('active');
        }
    });

</script>
